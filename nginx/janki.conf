# ── API: api.janki.care (HTTPS) ─────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name api.janki.care;

    ssl_certificate /etc/letsencrypt/live/janki.care/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/janki.care/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20M;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types application/json application/xml text/plain;
    gzip_comp_level 6;

    location / {
        limit_req zone=janki_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 90s;
    }
}

# ── HTTP → HTTPS redirects ───────────────────────────────────────────────────
server {
    listen 80;
    server_name janki.care www.janki.care;
    return 301 https://$host$request_uri;
}

server {
    listen 80;
    server_name doctor.janki.care;
    return 301 https://$host$request_uri;
}

server {
    listen 80;
    server_name admin.janki.care;
    return 301 https://$host$request_uri;
}

server {
    listen 80;
    server_name api.janki.care;
    return 301 https://$host$request_uri;
}
