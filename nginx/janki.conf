# ═══════════════════════════════════════════════════════════════════════════════
# Janki Care — Nginx Configuration
# Server: 164.52.215.42
# Port: 4000 (backend)
#
# DOMAINS:
#   janki.care / www.janki.care        → Client (patient portal)
#   doctor.janki.care                  → Admin (doctor panel)
#   admin.janki.care                   → Super Admin panel
#   api.janki.care                     → Backend API
#
# DO NOT CONFLICT WITH:
#   - sutraGram (ports 5000, 3004, zone: admin_general)
#   - estate100 (port 5050, zones: api, general)
# ═══════════════════════════════════════════════════════════════════════════════

# Rate limiting zones — unique prefix to avoid conflicts
limit_req_zone $binary_remote_addr zone=janki_api:10m rate=15r/s;
limit_req_zone $binary_remote_addr zone=janki_general:10m rate=30r/s;

# ── Client: janki.care (HTTPS) ──────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name janki.care www.janki.care;

    ssl_certificate /etc/letsencrypt/live/janki.care/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/janki.care/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml image/svg+xml;
    gzip_comp_level 6;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # WebSocket support for Socket.IO
    location /socket.io/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # SPA fallback
    location / {
        limit_req zone=janki_general burst=50 nodelay;
        root /var/www/janki/client/dist;
        try_files $uri $uri/ /index.html;

        location ~* \.(js|mjs|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot|wasm)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
    }
}

